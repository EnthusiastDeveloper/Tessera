[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
exclude = ["tests*"]

[project]
name = "tessera"
version = "0.1.0"
description = "Self-hosted task scheduling that respects the real shape of your day."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.12.0",
    "apscheduler>=3.10.0",
    "argon2-cffi>=23.1.0",
    "cryptography>=41.0.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.21.0",
    "ruff>=0.1.0",
    "mypy>=1.6.0",
    "import-linter>=2.0",
    "types-setuptools",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=app --cov-report=term-missing --cov-report=html"
asyncio_mode = "auto"

# Static enforcement of the layering rule (architecture-plan.md Section 2.1).
# A violation fails CI, same as a failing test - not a lint warning.
[tool.importlinter]
root_package = "app"

[[tool.importlinter.contracts]]
name = "Layering"
type = "layers"
layers = [
    "app.api",
    "app.task_templates | app.task_instances | app.notifications | app.calendar_sync | app.auth | app.settings",
    "app.db",
]

[[tool.importlinter.contracts]]
name = "Scheduling engine stays pure"
type = "independence"
modules = ["app.scheduling_engine"]
forbidden_modules = ["fastapi", "sqlalchemy"]

[tool.ruff]
line-length = 130
target-version = "py312"
select = ["E", "F", "W", "I"]
ignore = ["E501"]  # Line length handled separately

[tool.ruff.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[tool.coverage.run]
branch = true
source = ["app"]
omit = [
    "*/tests/*",
    "*/site-packages/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "if typing.TYPE_CHECKING:",
]
