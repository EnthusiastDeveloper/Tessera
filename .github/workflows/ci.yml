name: CI

on:
  push:
    branches: [main, stage-*]
  pull_request:
    branches: [main, stage-*]

jobs:
  backend:
    name: Backend (Python)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          cd backend
          pip install -e ".[dev]"

      - name: Ruff check
        run: |
          cd backend
          ruff check app tests

      - name: Ruff format check
        run: |
          cd backend
          ruff format --check app tests

      - name: MyPy type check
        run: |
          cd backend
          mypy app

      - name: Import linter
        run: |
          cd backend
          lint-imports

      - name: Pytest
        run: |
          cd backend
          pytest --cov=app --cov-report=xml --cov-report=term-missing

      - name: Coverage gate - scheduling_engine (>=90%)
        run: |
          cd backend
          coverage report --include="app/scheduling_engine/*" --fail-under=90

      - name: Upload coverage
        uses: codecov/codecov-action@v3
        with:
          files: ./backend/coverage.xml
          fail_ci_if_error: false

  frontend:
    name: Frontend (TypeScript/React)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ["20"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: |
          cd frontend
          npm ci

      - name: ESLint
        run: |
          cd frontend
          npm run lint

      - name: TypeScript check
        run: |
          cd frontend
          npm run type-check

      - name: Vitest
        run: |
          cd frontend
          npm run test

      - name: Production build
        run: |
          cd frontend
          npm run build

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    needs: [backend, frontend]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          cd backend
          pip install -e ".[dev]"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci

      - name: Install Playwright browsers
        run: |
          cd frontend
          npx playwright install --with-deps chromium

      - name: Run Playwright suite (against the real backend)
        run: |
          cd frontend
          npm run e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

  docker:
    name: Container Build & Test
    runs-on: ubuntu-latest
    needs: [backend, frontend]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build container image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./docker/Dockerfile
          push: false
          tags: tessera:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Test container image
        # Runs against a named volume, the way a real deployment does, and recreates the
        # container in the middle: an account created before must still exist after, which
        # a database kept in the container's own writable layer (or `:memory:`) would fail.
        run: |
          docker build -f docker/Dockerfile -t tessera:test .
          docker volume create tessera-ci-data

          start() {
            docker run -d --name tessera-test \
              -e SECRET_KEY=test-key \
              -e DATABASE_PATH=/app/data/tessera.db \
              -v tessera-ci-data:/app/data \
              -p 8000:8000 \
              tessera:test
            for _ in $(seq 1 30); do
              curl -sf http://localhost:8000/health && return 0
              sleep 1
            done
            docker logs tessera-test
            return 1
          }
          status_of() { curl -s -o /dev/null -w '%{http_code}' "$@"; }
          JSON='content-type: application/json'
          PASSWORD=correcthorsebatterystaple

          start || exit 1
          TOKEN=$(docker logs tessera-test 2>&1 | sed -n 's/.*Setup token[^:]*: //p' | head -1)
          code=$(status_of -X POST http://localhost:8000/api/v1/auth/setup -H "$JSON" \
            -d "{\"token\":\"$TOKEN\",\"password\":\"$PASSWORD\"}")
          [ "$code" = 201 ] || { echo "first-run setup returned $code"; docker logs tessera-test; exit 1; }

          docker rm -f tessera-test
          start || exit 1
          code=$(status_of -X POST http://localhost:8000/api/v1/auth/setup -H "$JSON" \
            -d "{\"token\":\"unused\",\"password\":\"$PASSWORD\"}")
          [ "$code" = 410 ] || { echo "setup after recreate returned $code, expected 410 (account lost?)"; exit 1; }
          code=$(status_of -X POST http://localhost:8000/api/v1/auth/login -H "$JSON" \
            -d "{\"username\":\"admin\",\"password\":\"$PASSWORD\"}")
          [ "$code" = 200 ] || { echo "login after recreate returned $code"; exit 1; }

          docker rm -f tessera-test
          docker volume rm tessera-ci-data
