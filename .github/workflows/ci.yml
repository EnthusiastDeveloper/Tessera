name: CI

on:
  push:
    branches: [main, stage-*]
  pull_request:
    branches: [main, stage-*]

jobs:
  backend:
    name: Backend (Python)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          cd backend
          pip install -e ".[dev]"

      - name: Ruff check
        run: |
          cd backend
          ruff check app tests

      - name: Ruff format check
        run: |
          cd backend
          ruff format --check app tests

      - name: MyPy type check
        run: |
          cd backend
          mypy app

      - name: Import linter
        run: |
          cd backend
          lint-imports

      - name: Pytest
        run: |
          cd backend
          pytest --cov=app --cov-report=xml --cov-report=term-missing

      - name: Coverage gate - scheduling_engine (>=90%)
        run: |
          cd backend
          coverage report --include="app/scheduling_engine/*" --fail-under=90

      - name: Upload coverage
        uses: codecov/codecov-action@v3
        with:
          files: ./backend/coverage.xml
          fail_ci_if_error: false

  frontend:
    name: Frontend (TypeScript/React)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ["20"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: |
          cd frontend
          npm ci

      - name: ESLint
        run: |
          cd frontend
          npm run lint

      - name: TypeScript check
        run: |
          cd frontend
          npm run type-check

      - name: Vitest
        run: |
          cd frontend
          npm run test

      - name: Production build
        run: |
          cd frontend
          npm run build

  docker:
    name: Container Build & Test
    runs-on: ubuntu-latest
    needs: [backend, frontend]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build container image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./docker/Dockerfile
          push: false
          tags: tessera:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Test container image
        run: |
          docker build -f docker/Dockerfile -t tessera:test .
          docker run --rm -d \
            --name tessera-test \
            -e SECRET_KEY=test-key \
            -e DATABASE_PATH=/app/data/ci-smoke-test.db \
            -p 8000:8000 \
            tessera:test
          sleep 5
          curl -f http://localhost:8000/health || exit 1
          docker stop tessera-test || true
